<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a7bf0"/><stop offset="1" stop-color="#1f3fa8"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe6f5"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0b1b5a" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g transform="translate(0 58)">
  <!-- IR signal arcs -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-width="30" opacity="0.9" transform="translate(-140 0)">
    <path d="M590 250 Q652 215 714 250" opacity="0.95"/>
    <path d="M565 195 Q652 140 739 195" opacity="0.7"/>
    <path d="M540 140 Q652 65 764 140" opacity="0.45" transform="translate(0 6)"/>
  </g>
  <!-- remote body -->
  <g filter="url(#sh)">
    <rect x="392" y="290" width="240" height="530" rx="84" fill="url(#body)" transform="rotate(0)"/>
  </g>
  <!-- IR emitter -->
  <rect x="470" y="306" width="84" height="16" rx="8" fill="#b7c3e3"/>
  <!-- power button -->
  <circle cx="512" cy="392" r="42" fill="#e5383b"/>
  <g fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round">
    <path d="M512 370 V398"/><path d="M493 381 A26 26 0 1 0 531 381"/>
  </g>
  <!-- d-pad -->
  <circle cx="512" cy="552" r="82" fill="#c9d3ec"/>
  <circle cx="512" cy="552" r="30" fill="#2a4bc4"/>
  <g fill="#2a4bc4">
    <path d="M512 484 l16 22 h-32z"/><path d="M512 620 l16 -22 h-32z"/>
    <path d="M444 552 l22 -16 v32z"/><path d="M580 552 l-22 -16 v32z"/>
  </g>
  <!-- buttons -->
  <g fill="#c9d3ec">
    <rect x="428" y="672" width="76" height="46" rx="23"/><rect x="520" y="672" width="76" height="46" rx="23"/>
    <rect x="428" y="736" width="76" height="46" rx="23"/><rect x="520" y="736" width="76" height="46" rx="23"/>
  </g>
</g>
</svg>
