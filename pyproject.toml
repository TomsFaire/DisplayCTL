[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dps"
version = "0.2.2"
description = "Display power scheduler with web UI"
requires-python = ">=3.9"
dependencies = []   # stdlib only: nothing to break at boot

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dps = "dps.cli:main"

[tool.setuptools]
packages = ["dps"]
[tool.setuptools.package-data]
dps = ["ui.html"]
